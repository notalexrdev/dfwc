# dfwc "ink" theme for foot: black, with soft colors that sit well on it.
# Every foot started inside dfwc uses this when you have no ~/.config/foot/foot.ini;
# to keep it in your own, add:  include=/usr/local/share/dfwc/xdg/foot/foot.ini

font=monospace:size=11
pad=12x12 center

[colors-dark]
background=000000
# 85% opaque background; text stays fully solid
alpha=0.85
foreground=d4d4d4
selection-background=2e2e2e
selection-foreground=ededed
cursor=000000 d4d4d4
# black red green yellow blue magenta cyan white
regular0=1c1c1c
regular1=d77c79
regular2=94b979
regular3=d9bc8c
regular4=88a4c9
regular5=b393c6
regular6=84b6b2
regular7=c8c8c8
bright0=505050
bright1=e8948f
bright2=a9cc8f
bright3=e7cd9f
bright4=a0b8da
bright5=c6a9d6
bright6=9bc9c5
bright7=ededed
